{% extends "base.html" %}

{% block title %}
    Блюда – Меню на неделю
{% endblock %}

{% block content %}
    <h1>Блюда</h1>

    <p>
        Всего блюд: {{ dishes|length }}
    </p>

    {% for dish in dishes %}
        {% include "dishes/includes/dish_card.html" %}
    {% empty %}
        <p>Блюда не найдены.</p>
    {% endfor %}
{% endblock %}
