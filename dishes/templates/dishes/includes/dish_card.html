<article class="card dish-card mb-3">
    <div class="card-body">
        {% if dish.image %}
            <img src="{{ dish.image.url }}" alt="" class="dish-thumb float-end ms-3">
        {% endif %}
        <h2 class="card-title h4">
            {{ dish.name|default:"Без названия" }}
        </h2>

        <p class="card-text">
            {{ dish.calories }} ккал, {{ dish.dish_type|capfirst }}
            {% if dish.is_light %}
                <span class="badge bg-success">лёгкое</span>
            {% endif %}
        </p>

        <a
            href="{{ dish.get_absolute_url }}"
            class="btn btn-primary"
        >
            Подробнее
        </a>
    </div>
</article>
