{# Одно поле формы: подпись, элемент ввода, подсказка и ошибки. #}
<div class="filter-field {{ field_class|default:'mb-3' }}">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text and show_help %}
        <div class="form-text">{{ field.help_text }}</div>
    {% endif %}
    {% for error in field.errors %}
        <div class="form-error">{{ error }}</div>
    {% endfor %}
</div>
